[workspace]
resolver = "3"
members = ["crates/*"]
# GPUI with Akyba's patches (see vendor/README.md): built as dependencies, not linted as Akyba.
exclude = ["vendor"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
akyba-bridge = { path = "crates/akyba-bridge" }
akyba-core = { path = "crates/akyba-core" }
akyba-design = { path = "crates/akyba-design" }
akyba-terminal = { path = "crates/akyba-terminal" }

# GPUI moves weekly; versions are pinned exactly and upgraded on purpose (docs/rust-stack.md).
gpui-kit = "=0.7.3"
alacritty_terminal = "=0.26.0"
portable-pty = "=0.9.0"

anyhow = "1"
ignore = "0.4"
notify = "8"
tempfile = "3"
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"

# Unoptimised GPUI and layout make every frame slow; optimise dependencies even in dev builds while
# keeping Akyba's own crates fast to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = "line-tables-only"

[profile.release]
# Whole-program link-time optimisation: about 3% smaller and no slower to run; only release builds
# take longer.
lto = "fat"
codegen-units = 1
# Symbols are only for debugging; a release build ships without them.
strip = "symbols"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
