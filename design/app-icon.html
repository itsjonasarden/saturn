<!doctype html>
<!-- Akyba's app icon. Rendered at 1024×1024 with a transparent background, then turned into
     crates/akyba/assets/app/Akyba.icns with sips and iconutil. The tile follows Apple's icon grid
     (824 px squircle in a 1024 px canvas). The mark is two slabs leaning in, the second set down a
     step: an A suggested rather than drawn. One white, one grey, no colour, like the tools it sits
     beside in the Dock. The menu bar mark (`menu_bar.rs`) and the welcome mark
     (`assets/brand/akyba.svg`) are the same two slabs. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
      }
      svg {
        position: absolute;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <svg width="1024" height="1024" viewBox="0 0 1024 1024">
      <defs>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#26282c" />
          <stop offset="1" stop-color="#08090a" />
        </linearGradient>
        <!-- A soft light from above, fading out by the middle, the way macOS tiles catch it. -->
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.10" />
          <stop offset="0.5" stop-color="#fff" stop-opacity="0" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.35" />
        </filter>
      </defs>
      <rect
        x="100"
        y="100"
        width="824"
        height="824"
        rx="185"
        fill="url(#ground)"
        filter="url(#shadow)"
      />
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)" />
      <path d="M262 760 L452 264 H572 L382 760 Z" fill="#f4f5f7" />
      <path d="M527 460 H647 L762 760 H642 Z" fill="#7c828b" />
      <rect
        x="101.5"
        y="101.5"
        width="821"
        height="821"
        rx="183.5"
        fill="none"
        stroke="#fff"
        stroke-opacity="0.10"
        stroke-width="3"
      />
    </svg>
  </body>
</html>
