name: Something's wrong
description: Akyba crashed, or did something it shouldn't.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what Akyba did, and what you expected. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open a repo with …
        2. Split the pane and …
  - type: input
    id: version
    attributes:
      label: Akyba version
      description: Akyba → About Akyba.
      placeholder: '0.1.12'
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.4, Apple Silicon
  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: If Akyba quit, paste the report macOS showed (or the one in Console → Crash Reports).
      render: text
