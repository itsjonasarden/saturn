[package]
name = "akyba"
description = "A terminal grid for running many Claude Code agents side by side"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets AKYBA_SCREENSHOT save what the window draws (spikes and tests); never in normal builds.
capture = ["dep:gpui-pre", "dep:gpui-pre-platform", "dep:image"]

[dependencies]
akyba-core.workspace = true
akyba-design.workspace = true
akyba-terminal.workspace = true
gpui-kit.workspace = true
serde.workspace = true
akyba-bridge.workspace = true
async-channel.workspace = true
serde_json.workspace = true
anyhow = "1"
# The protocol types gpui-component's editor speaks, at its version.
lsp-types = { version = "0.97.0", features = ["proposed"] }
# Grammars and highlight queries beyond the ones gpui-component bundles, and the full queries
# for its TSX and Swift; see src/languages.rs. The TSX/Swift ones are pinned to the versions
# gpui-component builds, so there is one copy of each grammar.
tree-sitter = "0.26"
tree-sitter-dart = "0.2.0"
tree-sitter-elm = "5.9.4"
tree-sitter-erlang = "0.21.0"
tree-sitter-fish = "3.6.0"
tree-sitter-gleam = "1.0.0"
tree-sitter-glsl = "0.2.0"
tree-sitter-haskell = "0.24.1"
tree-sitter-ini = "1.4.0"
tree-sitter-javascript = "=0.23.1"
tree-sitter-nix = "0.3.0"
tree-sitter-objc = "3.0.2"
tree-sitter-powershell = "0.26.4"
tree-sitter-prisma = "0.2.2"
tree-sitter-r = "1.3.0"
tree-sitter-scss = "1.0.0"
tree-sitter-swift = "=0.7.4"
tree-sitter-typescript = "=0.23.2"
tree-sitter-vim = "0.4.0"
tree-sitter-xml = "0.7.0"
notify.workspace = true
ignore.workspace = true
# HTTPS through macOS's own TLS and trust store.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# The same gpui-component gpui-kit bundles, named only to switch on the editor's languages.
gpui-component = { version = "=0.7.3", features = [
  "tree-sitter-astro",
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cmake",
  "tree-sitter-cpp",
  "tree-sitter-csharp",
  "tree-sitter-css",
  "tree-sitter-diff",
  "tree-sitter-ejs",
  "tree-sitter-elixir",
  "tree-sitter-erb",
  "tree-sitter-go",
  "tree-sitter-graphql",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-jsdoc",
  "tree-sitter-kotlin",
  "tree-sitter-lua",
  "tree-sitter-make",
  "tree-sitter-markdown",
  "tree-sitter-php",
  "tree-sitter-proto",
  "tree-sitter-python",
  "tree-sitter-ruby",
  "tree-sitter-rust",
  "tree-sitter-scala",
  "tree-sitter-sql",
  "tree-sitter-svelte",
  "tree-sitter-swift",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
  "tree-sitter-zig",
] }
gpui-pre = { version = "=0.3.9", features = ["test-support"], optional = true }
gpui-pre-platform = { version = "=0.3.9", features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSApplication",
  "NSBezierPath",
  "NSButton",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSDockTile",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSAffineTransform",
  "NSGeometry",
  "NSObject",
  "NSString",
  "NSBundle",
  "NSError",
  "NSFileManager",
  "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNUserNotificationCenter",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSound",
  "UNNotificationTrigger",
] }
block2 = "0.6"
security-framework = "3"

[package.metadata.cargo-machete]
# gpui-pre*/image: only switched on by the `capture` feature, to turn on GPUI's window-to-image
# support. gpui-component: named only to enable the editor's tree-sitter languages.
ignored = ["gpui-pre", "gpui-pre-platform", "image", "gpui-component"]

[lints]
workspace = true
